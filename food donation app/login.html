<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Annara</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">
  <nav class="navbar">
    <a href="index.html" class="logo">ann<span>●</span>ra</a>

    <a class="back-link" href="index.html">← Back to Home</a>
  </nav>

  <main class="login-container">
    <section class="login-box">
      <p class="small-title">WELCOME TO ANNARA</p>
      <h1>Sign in to help <span>share food.</span></h1>

      <form id="loginForm">
        <label for="role">I am a</label>
        <select id="role" required>
          <option value="">Choose your role</option>
          <option value="restaurant">Restaurant / Hotel</option>
          <option value="ngo">NGO / Shelter Home</option>
          <option value="driver">Volunteer / Driver</option>
          <option value="admin">Admin</option>
        </select>

        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          placeholder="example@email.com"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >
        <label class="show-password">
          <input type="checkbox" onchange="document.getElementById('password').type = this.checked ? 'text' : 'password'">
          Show password
        </label>

        <button class="main-btn login-btn" type="submit">
          Sign In
        </button>
      </form>

      <p class="register-text">
        New partner?
        <a href="register.html">Register your organisation</a>
      </p>

      <p id="loginMessage" class="login-message"></p>
    </section>
  </main>

<script src="script.js"></script>
</body>
</html>
